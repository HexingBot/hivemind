<title>Hivemind — Release Notes</title>
<meta name="description" content="Hivemind release notes: the full history of changes across every version.">

<div style="position:fixed; inset:0; z-index:2; pointer-events:none; background:repeating-linear-gradient(0deg, rgba(0,0,0,.28) 0px, rgba(0,0,0,.28) 1px, transparent 1px, transparent 3px);"></div>

<div id="app" style="position:relative; z-index:3; min-height:100vh; padding:0 20px 56px; font-family:'VT323',monospace; color:#cfe3ff;"></div>

<script>
// The canonical human record is CHANGELOG.md at the repo root. This array is the
// site-rendered mirror. When you cut a release: prepend the new entry below to
// this RELEASES array, bump `const VERSION` in index.html to match, and update
// CHANGELOG.md to match.
const RELEASES = [
  {
    v: "0.21.0", date: "2026-08-06", tag: "The hooks that never ran",
    summary: "A user said the plugin stopped being found after an update. Following that report uncovered something bigger: the context-monitor hooks written into every project used a shape Claude Code rejects, so they had never run at all — since June.",
    highlights: [
      "The hook entries written into your project's settings file were malformed. Claude Code requires the command to sit inside a nested hooks list; we wrote it directly on the entry instead. Its own validator rejects that outright — so context auto-flush and the handoff snapshot have been silently dead in every install since June. Confirmed by running claude doctor against both shapes, not by reading the docs.",
      "New projects now get the correct shape, and existing broken ones are repaired automatically by a hook that runs at session start. No command to remember, no release notes to read. It only ever touches its own entries — unrelated hooks and settings come back byte-identical.",
      "The separate self-repair for stale paths after an update was only doing half its job: it fixed the statusline and silently skipped every hook, which is exactly why the problem seemed to keep coming back. It now handles both shapes, and its 'all clear' message is computed by an independent scan rather than by trusting the repair — so it can no longer report success over its own blind spot.",
      "The manual repair command in the update docs did not actually run. It relied on a variable that only exists inside hook processes, never in a terminal. It now looks up where the plugin really lives.",
      "Disposing an isolated worktree could delete the main checkout's dependency folder, by following the link between them. The link is now cut first — verified by reproducing the destruction without the fix and confirming the folder survives with it.",
      "Handback used to merge rebuilt bundles as if they were ordinary text, splicing two different builds into one file that matched neither. It now refuses when both sides rebuilt the same file, turning a silent corruption into a visible stop.",
      "Pack bookkeeping is honest in both directions: adopting a skill no longer deletes another pack's claim on it or quietly downgrades its 'do not remove' flag, and the installer's success check can no longer let a surplus in one place hide a failure in another.",
      "New tool for asking whether the running server is still on current code — it loads from a version-pinned cache that a local rebuild never touches, so 'I rebuilt it' and 'the server is running it' are genuinely different questions.",
    ],
  },
  {
    v: "0.20.0", date: "2026-08-04", tag: "Worktree isolation & ticket-integrity hardening",
    summary: "Agents that run at the same time stopped sharing one folder, and the rules that decide when a ticket may be closed got a lot harder to talk your way past.",
    highlights: [
      "Each concurrent developer agent now gets its own git worktree — its own checkout, its own git index. Before this, two agents working at once shared one staging area, and only a careful commit convention kept them from committing each other's half-finished files. This removes the hazard at the source instead of asking everyone to be careful.",
      "Fixed a real data-loss bug found the first time worktrees were used for real. A worktree links to the main project's node_modules rather than reinstalling it, and deleting the worktree could follow that link and empty the main project's dependency folder. The link is now cut before deletion, verified in both directions: the destruction was reproduced without the fix, and the folder survived intact with it.",
      "Ticket integrity: a manual test verdict must now match a strict grammar (so a note buried above or below the steps can't smuggle a failure past the gate), a ticket can only reach done from in_review, the evidence required scales with how the ticket was verified, comment authors are a fixed list, and invisible Unicode characters are stripped from comments.",
      "Started a project-wide rule we call the empty-result contract: an operation that finds nothing must say whether that means nothing needed doing or the thing that looks for work is broken. Applied to the test-selection commands and to the pack installer, both of which could previously report plain success while doing nothing.",
      "Pack layer: skill copies are now taken from the plugin rather than from the project installing it — the old default silently installed nothing in a real consumer project while still reporting success.",
      "Path safety: reference names now reject whitespace, newlines, percent-encoding and unanchored '..' segments, and acceptance criteria that assert nothing are rejected at intake.",
    ],
  },
  {
    v: "0.19.0", date: "2026-07-28", tag: "The watch skill works on install",
    summary: "A delivery fix: the video-watching skill shipped in 0.18.0 but never actually appeared for anyone who installed the plugin.",
    highlights: [
      "Claude Code only auto-discovers skills from one specific folder in a plugin, and watch wasn't in it. Installing the plugin gave you no watch skill at all unless you knew to run a manual reconcile command. It now ships in the right place and loads immediately.",
      "Added a drift sensor that compares the shipped copy against the vetted original file-by-file and byte-by-byte, scripts included. Watch's behaviour lives in its Python scripts, so a check that only compared the documentation would let a modified downloader ship unnoticed.",
      "The older add-on install path still works and was deliberately left in place. Removing it would have made the reconciler delete a working skill from projects that already had it.",
    ],
  },
  {
    v: "0.18.0", date: "2026-07-23", tag: "Design pack expansion",
    summary: "Added a video skill as a built-in, and a consented way to pull in well-regarded third-party design tools without copying them into the project.",
    highlights: [
      "The watch video skill (from github.com/bradautomates/claude-video, MIT licensed) was vetted, copied in, and registered as a built-in pack so it installs through the normal reconcile step.",

    highlights: [
      "New kb_graph_query tool for structured graph lookups. Every filter you pass either takes effect or returns a typed error — it will never quietly ignore one and hand back results that look complete but aren't.",
      "A freshness sensor now fails the release gate when a finished ticket has no matching graph node, and closing a ticket creates that node automatically. Previously this depended on someone remembering. The sensor caught real drift twice within hours of shipping.",
      "Agents now query the graph through the tool alongside the knowledge-base lookup before reaching for a web search, rather than reading the raw graph file.",
      "The setup wizard now creates a planning ticket carrying the problem, goals and scope you described, so the discovery conversation actually reaches the backlog instead of evaporating.",
      "Fixed a stray empty bullet in the generated project file when you skipped a question with Enter.",
    ],
  },
  {
    v: "0.16.0", date: "2026-07-14", tag: "Security hardening & self-improvement",
    summary: "Split self-improvement into a constructive half and a security half, and hardened the setup wizard against hostile input.",
    highlights: [
      "New hive-self-improve skill for quality work — simplification, dead code, coverage gaps. Any finding that touches security or a trust boundary is handed off to the adversarial skill rather than handled in place.",
      "Skills are now scoped: the ones that operate on the framework itself stay local, and consumer-facing variants ship to installed projects. Neither can be run against the wrong target.",
      "The reviewer agent was re-pinned to Fable 5, the strongest model, so the independent quality gate stays on the best available model regardless of what the session is running.",

  },
  {
    v: "0.14.2", date: "2026-07-09", tag: "Design-pack usability fix",

  },
  {
    v: "0.14.1", date: "2026-07-09", tag: "Hooks hotfix",
    summary: "Same-day hotfix for the plugin's hooks configuration.",
    highlights: ["Fixed the plugin hooks configuration shipped in 0.14.0."],
  },
  {
    v: "0.14.0", date: "2026-07-09", tag: "The add-on surface, wired up",

      "Shipped pack-ctl as a bundled command-line tool, so it works in a plugin install where the framework's source files aren't on disk.",

    ],
  },
  {
    v: "0.13.0", date: "2026-07-08", tag: "Design-power pack",
    summary: "A pack for design-heavy projects, selected by a short questionnaire during setup.",
    highlights: ["Design profiling during intake, and a set of design skill resources that install based on the answers."],
  },
  {
    v: "0.12.0", date: "2026-07-08", tag: "Skills & packs page",
    summary: "Documentation and packaging polish.",
    highlights: ["Added the skills & packs sub-page to this site, plus packaging fixes."],
  },
  {
    v: "0.11.0", date: "2026-07-07", tag: "Autonomous loop correctness",
    summary: "A drive focused on making the self-driving loop pick the right work and survive a crash.",
    highlights: [
      "Fixed which ticket the loop selects next, and shipped the loop control tool as a bundle so it runs in a plugin install.",
      "Revived the calibration gate, guarded the ticket-close path, and made crash resume correct — a crash mid-ticket no longer leaves that ticket invisible to the loop forever.",
      "Added the knowledge-base lookup and capture seam, so what the loop learns can be written down.",
    ],
  },
  {
    v: "0.10.0", date: "2026-07-04", tag: "Session locking & state resilience",
    summary: "Made it safe for only one session to drive at a time, and made a crash recoverable.",
    highlights: [
      "Session lock hardened with an exclusive acquire and a compare-and-swap steal for genuinely abandoned locks, so two sessions can't drive the same board at once.",
      "The loop records where it is, so a crash resumes at the right phase instead of starting over or stranding a ticket.",
      "Ticket close became a single all-or-nothing operation: a guard failure or a malformed input leaves the ticket file byte-unchanged rather than half-written.",
    ],
  },
  {
    v: "0.9.0", date: "2026-06-23", tag: "Lock & store robustness",
    summary: "Reliability work on the session lock and the state store underneath it.",
    highlights: ["Robustness fixes to the session lock and the state store."],
  },
  {
    v: "0.8.0", date: "2026-06-23", tag: "Context auto-flush",
    summary: "Long sessions stopped falling over when the context window filled up.",
    highlights: ["Automatic context flushing, plus path healing for references that broke across a flush."],
  },
  {
    v: "0.7.0", date: "2026-06-17", tag: "Promoted to an agentic framework",
    summary: "The point where the beta line became the framework this is now.",
    highlights: [
      "Shipped the loop engine that drives tickets toward a stated goal without step-by-step instruction.",
      "Introduced the two operating modes: harness, where a human approves each step, and loop, where the session drives itself within explicit gates.",
      "Added app preview.",
    ],
  },
  {
    v: "0.6.0", date: "2026-06-16", tag: "Ergonomics trio",
    summary: "Three quality-of-life additions.",
    highlights: [
      "A console launcher that opens directly into a project.",
      "An /update command for pulling in newly shipped commands and agents.",
      "The graphify skill and the /graph view for looking at the knowledge graph.",
    ],
  },
  {
    v: "0.5.0", date: "2026-06-15", tag: "Web console (since removed)",

    highlights: [

      "Added the build-artifact parity gate: committed bundles are rebuilt and byte-compared during the release check, so a stale bundle can't ship silently.",

    highlights: [

      "deep-research fans out several research angles at once for broad or unfamiliar questions.",
      "A retrofit flag adds these to projects that were set up before they existed.",
    ],
  },
  {
    v: "0.2.0", date: "2026-06-11", tag: "Refinement",

  {
    v: "0.1.1", date: "2026-06-08", tag: "Packaging fixes",

  {
    v: "0.1.0", date: "", tag: "First release",
    summary: "Everything needed to take one ticket from idea to closed.",

const PS = "font-family:'Press Start 2P',monospace;";
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

const cards = RELEASES.map((r, i) => {
  const latest = i === 0;
  const accent = latest ? "#ff9a1f" : "#b07fff";
  const items = r.highlights.map(h =>
    `<li style="font-size:20px; line-height:1.45; color:#9fb4d8; margin:0 0 12px; list-style:none; position:relative; padding-left:24px;">
       <span style="position:absolute; left:0; top:1px; color:${accent};">▚</span>${esc(h)}</li>`).join("");
  const summary = r.summary
    ? `<p style="font-size:21px; line-height:1.4; color:#cfe3ff; margin:0 0 16px; padding-left:14px; border-left:3px solid ${accent};">${esc(r.summary)}</p>`
    : "";
  return `
  <article style="border:2px solid ${latest ? "#ff9a1f" : "#1d2740"}; background:linear-gradient(180deg,rgba(13,18,32,.92),rgba(8,11,20,.92)); padding:20px 22px 22px; margin-bottom:20px; box-shadow:${latest ? "0 0 26px rgba(255,154,31,.14)" : "inset 0 0 40px rgba(176,127,255,.05)"};">
    <div style="display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; margin-bottom:14px;">
      <span style="${PS} font-size:16px; color:${accent}; letter-spacing:1px;">v${esc(r.v)}</span>
      ${latest ? `<span style="${PS} font-size:9px; color:#05060a; background:#ff9a1f; padding:5px 8px; letter-spacing:1px;">LATEST</span>` : ""}
      <span style="font-size:19px; color:#e9f1ff;">${esc(r.tag)}</span>
      <span style="font-size:18px; color:#5a6f9c; margin-left:auto;">${esc(r.date)}</span>
    </div>
    ${summary}
    <ul style="margin:0; padding:0;">${items}</ul>
  </article>`;
}).join("");

document.getElementById("app").innerHTML = `
  <div style="max-width:900px; margin:0 auto;">
    <div style="display:flex; justify-content:space-between; align-items:center; padding:18px 2px 0; flex-wrap:wrap; gap:10px;">
      <a href="index.html" style="${PS} font-size:11px; letter-spacing:1px; padding:10px 14px; background:#0d1220; color:#8bd6ff; border:2px solid #2b4a66; box-shadow:3px 3px 0 #061019;">◄ HOME</a>
      <a href="skills.html" style="${PS} font-size:11px; letter-spacing:1px; padding:10px 14px; background:#0d1220; color:#8bd6ff; border:2px solid #2b4a66; box-shadow:3px 3px 0 #061019;">SKILLS &amp; PACKS</a>
    </div>

    <header style="text-align:center; padding:30px 0 24px;">
      <h1 style="${PS} font-size:clamp(22px,5vw,40px); margin:0; letter-spacing:2px; color:#ff9a1f; text-shadow:3px 3px 0 #7a3d00, 0 0 22px rgba(255,154,31,.5); -webkit-text-stroke:1px #ffd39a;">RELEASE NOTES</h1>
      <p style="${PS} font-size:clamp(8px,1.5vw,11px); color:#b07fff; letter-spacing:2px; margin:16px 0 0;">H I V E M I N D&nbsp;&nbsp;·&nbsp;&nbsp;T H E&nbsp;&nbsp;H I S T O R Y</p>
      <p style="font-size:21px; line-height:1.4; color:#9fb4d8; max-width:660px; margin:20px auto 0;">
        Every version, newest first — what changed and why it mattered.
        Written to be readable without knowing the codebase.
      </p>
    </header>

    <div style="height:2px; background:repeating-linear-gradient(90deg,#ff9a1f 0 14px,transparent 14px 22px); margin-bottom:26px;"></div>

    ${cards}

    <div style="text-align:center; margin-top:30px; border-top:2px solid #1d2740; padding-top:22px;">
      <p style="font-size:19px; line-height:1.4; color:#5a6f9c; margin:0 auto; max-width:640px;">This page is the readable mirror. The canonical record, with ticket numbers and file-level detail, is
        <a href="https://github.com/HexingBot/hivemind/blob/main/CHANGELOG.md" target="_blank" rel="noopener noreferrer">CHANGELOG.md</a>.</p>
    </div>
  </div>`;
</script>
</body>
</html>
