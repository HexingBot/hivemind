name: CI

# TASK-224 — minimal, boring CI: run the fast test tier on every push, and the
# full test tier (including dist-parity and the use-case suite) on every pull
# request targeting main.
#
# TASK-224 deliberately did NOT include any gate on tasks/ or the TASK-223
# ticket-debt audit: that audit starts at 161 tickets of pre-existing debt,
# and wiring it into CI directly would have turned the very first build (and
# every one after it) red on day one. A chronically red CI stops being a
# control and becomes noise people learn to ignore and then disable — which
# is worse than not having the control at all. TASK-225 (the `uat-gate` job
# below) is that separate, deliberate promotion step, now that TASK-223 has
# frozen the pre-existing debt as a documented baseline (docs/uat-baseline.md)
# that never trips the gate.
on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  fast:
    name: Fast tier (npm test)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # No continue-on-error, no `|| true`, no conditional skip: vitest's own
      # exit code is the job's exit code, so a real test failure is a red
      # build (AC6), never a silent or vacuous green.
      - run: npm test

  full:
    name: Full tier (npm run test:all)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # Same rule as the fast job: the full tier (fast + tests/e2e/**,
      # including dist-parity and the use-case suite) reports its own exit
      # code untouched.
      - run: npm run test:all

  uat-gate:
    name: UAT board gate (npm run gate:uat)
    # TASK-225 — deliberately UNCONDITIONAL (no `if:` on github.event_name),
    # unlike `fast`/`full` above. GitHub treats a `skipped` required check as
    # SATISFIED, not failed (a finding from TASK-224's review) — `fast` and
    # `full` can each legitimately skip because between them every event this
    # workflow triggers on (`push`, `pull_request`) is covered by exactly one
    # of the two. This job instead covers a SINGLE build-blocking invariant
    # that must hold on every event, so it runs on both rather than being
    # split the same way; splitting it would recreate the exact skip-as-pass
    # gap this comment is warning about. If you add branch protection rules
    # for this repo, require this job's check by name and verify it never
    # shows as "skipped" for any protected event.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # bin/ci-uat-gate.js's own exit code is the job's exit code: 0 for a
      # qualified pass (ZERO_EXAMINED or COMPLIANT — see that file's header
      # for why a zero-examined result is a marker, not a hard failure), 1
      # for a board-read failure, 2 for a real post-cutoff violation. No
      # continue-on-error, no `|| true`, no conditional skip.
      - run: npm run gate:uat
